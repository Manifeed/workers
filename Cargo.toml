[workspace]
members = [
  "crawler_rss",
]
resolver = "2"

[workspace.dependencies]
async-trait = "0.1"
chrono = "0.4"
clap = "4.5"
directories = "5"
feed-rs = "2"
hex = "0.4"
hmac = "0.12"
html-escape = "0.2"
httpdate = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false }
semver = "1"
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-normalization = "0.1"
uuid = "1"

[profile.dev]
debug = 0

[profile.dev.build-override]
debug = 0

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
